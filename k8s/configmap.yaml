apiVersion: v1
kind: ConfigMap
metadata:
  name: screencast-recorder-config
  namespace: statex-apps
  labels:
    app: screencast-recorder
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "screencast-recorder"
  DOMAIN: "screencast.alfares.cz"
  PORT: "3391"

  # Capture defaults. Non-secret, and deliberately visible here so the operator
  # can see what a session will do before starting one.
  #
  # 15 fps: a screencast of code and terminals is near-static, so this roughly
  # halves the byte volume against 30 fps with no perceptual loss for this
  # content.
  SCREEN_DEFAULT_FPS: "15"
  # 60-second segments cap crash loss at one segment and let a later editing
  # stage drop whole intervals with -c copy, without re-encoding.
  SCREEN_SEGMENT_SECONDS: "60"
  # Measured on alfares: 4K/15fps VAAPI at QP 24 produces ~1.4 GB/hour on
  # near-static screen content, so a four-hour session is ~6 GB. The floor is
  # set well above that because the figure rises sharply with motion -- video
  # playback or fast scrolling can multiply it several times over.
  RECORDING_MIN_FREE_GB: "20"
  # How far ahead T0 is placed once every agent is ready: long enough for the
  # long poll to deliver the start command, short enough not to feel laggy.
  START_BARRIER_LEAD_SECONDS: "5"
  ACTIVITY_SAMPLE_HZ: "5"
