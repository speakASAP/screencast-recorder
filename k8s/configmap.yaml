apiVersion: v1
kind: ConfigMap
metadata:
  name: screencast-recorder-config
  namespace: statex-apps
  labels:
    app: screencast-recorder
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "screencast-recorder"
  DOMAIN: "screencast.alfares.cz"
  PORT: "3391"
  # Add environment variables from .env that are non-sensitive (no secrets, API keys, passwords)
  # Examples:
  # DATABASE_POOL_SIZE: "10"
  # LOG_LEVEL: "info"
  # TIMEOUT_MS: "30000"
