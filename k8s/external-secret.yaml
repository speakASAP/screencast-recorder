apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: screencast-recorder-secret
  namespace: statex-apps
  labels:
    app: screencast-recorder
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: screencast-recorder-secret
    creationPolicy: Owner
  # Every key the service consumes needs its own entry here. There is no
  # wildcard form: a key present in Vault but missing from this list never
  # reaches the pod, while ESO still reports the ExternalSecret as Synced.
  # Verify by enumerating the generated Secret's keys, not by reading
  # Ready=True.
  #
  # ESO also does not prune. Removing a property from Vault leaves the key in
  # the Kubernetes Secret until its entry is deleted here too.
  data:
    # --- PostgreSQL: database `screencast`, role `screencast_app` ---
    - secretKey: DB_HOST
      remoteRef:
        key: secret/prod/screencast-recorder
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: secret/prod/screencast-recorder
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: secret/prod/screencast-recorder
        property: DB_NAME
    - secretKey: DB_USER
      remoteRef:
        key: secret/prod/screencast-recorder
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/screencast-recorder
        property: DB_PASSWORD

    # --- MinIO: scoped, non-root service account limited to one bucket ---
    - secretKey: MINIO_ENDPOINT_URL
      remoteRef:
        key: secret/prod/screencast-recorder
        property: MINIO_ENDPOINT_URL
    - secretKey: MINIO_BUCKET
      remoteRef:
        key: secret/prod/screencast-recorder
        property: MINIO_BUCKET
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: secret/prod/screencast-recorder
        property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: secret/prod/screencast-recorder
        property: MINIO_SECRET_KEY

    # --- Ecosystem service endpoints ---
    - secretKey: AUTH_SERVICE_URL
      remoteRef:
        key: secret/prod/screencast-recorder
        property: AUTH_SERVICE_URL
    - secretKey: LOGGING_SERVICE_URL
      remoteRef:
        key: secret/prod/screencast-recorder
        property: LOGGING_SERVICE_URL
    - secretKey: MONITORING_SERVICE_URL
      remoteRef:
        key: secret/prod/screencast-recorder
        property: MONITORING_SERVICE_URL

    # Per-pair Auth-issued RS256 credential
    # (svc-screencast-agent--screencast-recorder) holding
    # internal:screencast-recorder:agent. The API verifies tokens presented by
    # the host agent; the agent itself reads this same Vault property through
    # AppRole, because it runs outside Kubernetes and has no Secret to mount.
    # Minted only by auth-microservice/scripts/provision-service-token.js.
    # Rotate before 90 days; acceptance is a successful authenticated call.
    - secretKey: AGENT_BEARER
      remoteRef:
        key: secret/prod/screencast-recorder
        property: AGENT_BEARER
