apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: screencast-recorder-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: screencast-recorder-secret
    creationPolicy: Owner
  data:
    # Add only keys the service consumes from secret/prod/screencast-recorder.
    # Delete this manifest and the Deployment secretRef when no secrets exist.
    - secretKey: REPLACE_ME
      remoteRef:
        key: secret/prod/screencast-recorder
        property: REPLACE_ME
