apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: screencast-recorder
  namespace: statex-apps
  labels:
    app: screencast-recorder
    managed-by: k8s-migration
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - screencast.alfares.cz
      secretName: screencast-recorder-tls
  rules:
    - host: screencast.alfares.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: screencast-recorder
                port:
                  number: 3391
